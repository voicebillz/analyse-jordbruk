<style>
:root{
  color-scheme:light;
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#f7f8f5; --surface-3:#eef1ec; --line:#e1e5de; --line-2:#eceee9;
  --ink:#18201a; --ink-2:#4a544c; --ink-3:#7b857d;
  --accent:#2e5e45; --accent-2:#3e7a59; --accent-ink:#ffffff; --accent-soft:#e4efe8; --accent-line:#b9d3c3;
  --head-bg:#24493a; --head-ink:#ffffff; --head-btn:rgba(255,255,255,.12); --head-btn-line:rgba(255,255,255,.22);
  --in-bg:#fffbea; --in-line:#e3cf72; --in-focus:#2e5e45;
  --warn:#8a5300; --warn-soft:#fff2d9; --bad:#b3261e; --bad-soft:#fde8e6; --good:#1d6b3a; --good-soft:#e1f2e6;
  --info-soft:#e9f1fb; --info:#1b4470;
  --shadow:0 1px 2px rgba(16,24,18,.05),0 6px 20px rgba(16,24,18,.05);
  --radius:12px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --surface:#181e1a; --surface-2:#1e2520; --surface-3:#242c26; --line:#2c3530; --line-2:#252d28;
  --ink:#e8eee9; --ink-2:#b5c0b8; --ink-3:#86918a;
  --accent:#7cc79c; --accent-2:#95d6b0; --accent-ink:#0d1a12; --accent-soft:#1d3428; --accent-line:#2f5a43;
  --head-bg:#151b17; --head-ink:#e8eee9; --head-btn:rgba(255,255,255,.06); --head-btn-line:rgba(255,255,255,.14);
  --in-bg:#24251a; --in-line:#5f5527; --in-focus:#7cc79c;
  --warn:#f0b55a; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1a18; --good:#7cc79c; --good-soft:#173022;
  --info-soft:#16243a; --info:#9cc3f0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.01em}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--head-bg);color:var(--head-ink);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:15px}
:root:not([data-theme="dark"]) .brand .logo{background:rgba(255,255,255,.14);color:#fff}
.meta{font-size:13px;opacity:.8}
.grow{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:var(--head-btn);border:1px solid var(--head-btn-line);color:var(--head-ink);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:550}
.hbtn:hover{filter:brightness(1.15)}
.hbtn.on{background:var(--head-ink);color:var(--head-bg)}
.seg{display:inline-flex;border:1px solid var(--head-btn-line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--head-ink);padding:6px 11px;font-size:13px;cursor:pointer;opacity:.75}
.seg button.on{background:var(--head-btn);opacity:1;font-weight:650}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:200px;padding:6px;display:none}
.menu.open .menu-pop{display:block}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu-pop button:hover{background:var(--surface-3)}
/* ---------- stepper ---------- */
.steps{background:var(--surface);border-bottom:1px solid var(--line)}
.steps-in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;padding:14px 12px;border:0;background:none;cursor:pointer;color:var(--ink-3);border-bottom:3px solid transparent;font-weight:550}
.step:disabled{cursor:default;opacity:.55}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:700;flex:none}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step.cur{color:var(--ink);border-bottom-color:var(--accent)}
.step.cur .n{background:var(--accent);color:var(--accent-ink)}
.substeps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.sub{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.sub:disabled{opacity:.5;cursor:default}
.sub.done{border-color:var(--accent-line);color:var(--accent)}
.sub.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 24px 110px}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin:0 0 18px;flex-wrap:wrap}
.pagehead h1{font-size:24px;margin:0}
.pagehead .k{font-size:12.5px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 12px}
.card h3{font-size:14.5px;margin:18px 0 10px}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--ink-3)}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--ink-2)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.choice .opt{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.choice .opt h3{margin:0;font-size:15px}
.choice .opt p{margin:0;color:var(--ink-2);font-size:13.5px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:550}
.field input,.field select,.inp,.sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0}
.inp.num{background:var(--in-bg);border-color:var(--in-line);text-align:right;font-variant-numeric:tabular-nums;width:100%;max-width:150px}
.inp:focus,.sel:focus,.field input:focus{outline:2px solid var(--in-focus);outline-offset:0;border-color:transparent}
.inp.num::placeholder{color:var(--ink-3)}
.sel{background:var(--surface);padding:6px 8px;max-width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 18px}
.fields .field .unit{font-weight:400;color:var(--ink-3)}
.fields .field .inp.num{max-width:none}
/* ---------- tabeller ---------- */
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{text-align:left;font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sum td{font-weight:700;border-top:1px solid var(--line)}
table.t tr.grp td{background:var(--surface-3);font-weight:650;color:var(--accent);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
table.t .inp.num{max-width:130px}
table.t .acc,.acc{white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sm{font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:10px;padding:11px 14px;margin:0 0 14px;font-size:13.5px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.search{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface);min-width:240px;flex:1;max-width:420px}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.prodcard{border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;background:var(--surface);cursor:pointer;transition:border-color .15s}
.prodcard:hover{border-color:var(--accent-2)}
.prodcard.on{border-color:var(--accent);background:var(--accent-soft)}
.prodcard input{margin-top:3px;accent-color:var(--accent)}
.prodcard .nm{font-weight:650}
.prodcard .sub2{font-size:12.5px;color:var(--ink-3)}
details.grp{border:1px solid var(--line);border-radius:11px;margin:8px 0;background:var(--surface)}
details.grp>summary{cursor:pointer;padding:11px 14px;font-weight:650;display:flex;gap:10px;align-items:center;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:before{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.grp[open]>summary:before{transform:rotate(45deg)}
details.grp .inner{padding:0 14px 12px}
.maprow{display:grid;grid-template-columns:110px minmax(160px,1fr) minmax(170px,240px) minmax(150px,200px) 80px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.maprow:last-child{border-bottom:0}
.maprow.manual .nr{font-weight:700;color:var(--accent)}
.maprow .inp.num{max-width:80px}
.moves .mv{display:grid;grid-template-columns:1fr 1fr 140px 2fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.moves .mv .btn{margin-top:22px}
.textcard textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2);line-height:1.6;resize:none;overflow:hidden}
.textcard textarea:focus{outline:2px solid var(--in-focus);border-color:transparent}
.pdfwrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface-3);height:calc(100vh - 250px);min-height:520px}
.pdfwrap iframe{width:100%;height:100%;border:0;display:block}
.pdfwrap .ph{display:grid;place-items:center;height:100%;color:var(--ink-3)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15}
.foot-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center}
.hidden{display:none!important}
@media (max-width:760px){
  .wrap{padding:18px 16px 110px}
  .top-in{padding:10px 16px}
  .step .lbl{display:none}
  .card{padding:16px}
  table.t thead{display:none}
  table.t tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.t td{border:0;padding:2px 0}
  table.t td[data-l]:before{content:attr(data-l);display:block;font-size:11px;color:var(--ink-3)}
  table.t td.n{text-align:left}
  table.t td.wide{grid-column:1/-1}
  .maprow{grid-template-columns:1fr 1fr}
  .moves .mv{grid-template-columns:1fr 1fr}
}
</style>
</head>

function importFile(file) {
  if (!file) return;
  if (typeof XLSX === "undefined") { alert(T("Kunne ikke lese fila.")); return; }
  file.arrayBuffer().then(buf => {
    const isText = /\.(csv|txt)$/i.test(file.name);
    const wb = XLSX.read(buf, {type: "array", raw: isText});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: "", raw: true});
    let hi = rows.findIndex(r => r.some(c => /konto/i.test(String(c))) && r.some(c => /saldo|ub|utg|beløp|belop/i.test(String(c))));
    if (hi < 0) hi = 0;
    const H = rows[hi].map(c => String(c).toLowerCase());
    const col = (...res) => { for (const re of res) { const i = H.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
    const cNr = col(/^konto(nr|nummer)?$|kontonummer|^nr$/, /konto/);
    const cNavn = col(/navn|namn|beskrivelse|tekst/), cIb = col(/inng|^ib$|opening/), cUb = col(/utg/, /^ub$|closing/, /^saldo$/);
    const cEnd = col(/endring|bevegelse|periode/, /beløp|belop/), cM1 = col(/mengde ?1|antall|mengde$/), cM2 = col(/mengde ?2/);
    const sb = [];
    rows.slice(hi + 1).forEach(r => {
      const raw = String(r[cNr] ?? "").trim(); if (!raw) return;
      let nr = raw.match(/^\d{4}(\.\d+){0,2}/); if (!nr) return; nr = nr[0];
      if (typeof r[cNr] === "number" && /^\d{4}\.\d$/.test(nr)) nr += "0";
      const navn = cNavn >= 0 ? String(r[cNavn]).trim() : raw.replace(nr, "").trim();
      const ib = cIb >= 0 ? num(r[cIb]) : 0;
      const ub = cUb >= 0 ? num(r[cUb]) : ib + (cEnd >= 0 ? num(r[cEnd]) : 0);
      const m1 = cM1 >= 0 ? num(r[cM1]) : 0, m2 = cM2 >= 0 ? num(r[cM2]) : 0;
      sb.push(parseInt(nr, 10) >= 3000 ? {nr, navn: navn || kontoNavn(nr), ib: 0, ub, m1, m2} : {nr, navn: navn || kontoNavn(nr), ib, ub, m1ib: 0, m1ub: m1, m1: 0, m2: 0});
    });
    if (!sb.length) { alert(T("Fant ingen kontoer i fila.")); return; }
    const keep = {klient: S.klient, utarbeidd: S.utarbeidd, aar: S.aar};
    S = freshState(); Object.assign(S, keep); S.sb = sb.sort((a, b) => byNr(a.nr, b.nr)); S.source = file.name; save(); render();
  }).catch(() => alert(T("Kunne ikke lese fila.")));
}

const PC = {accent: "#2e5e45", ink: "#1b211c", ink2: "#4a544c", muted: "#7b857d", line: "#e2e6df", soft: "#f3f6f2", s1: "#2a78d6", s2: "#eb6834", grid: "#eceee9"};
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function barSvg(items, o = {}) {
  const series = o.series || [{color: PC.s1}], W = o.width || 515, labW = o.labelW || 130, valW = 62;
  const bh = o.bar || 11, gap = 3, rowH = series.length * bh + (series.length - 1) * gap + (o.bar && o.bar < 9 ? 7 : 12);
  const H = items.length * rowH + 22;
  const all = items.flatMap(i => i.values), step = niceStep(((Math.max(0, ...all) - Math.min(0, ...all)) || 1) / 4);
  const max = Math.ceil(Math.max(0, ...all) / step) * step, min = Math.floor(Math.min(0, ...all) / step) * step, span = (max - min) || 1;
  const plotW = W - labW - valW, x = v => labW + (v - min) / span * plotW, x0 = x(0);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let v = min; v <= max + step / 2; v += step) { const xx = x(v);
    s += `<line x1="${xx}" x2="${xx}" y1="0" y2="${H - 16}" stroke="${PC.grid}" stroke-width="0.8"/><text x="${xx}" y="${H - 4}" text-anchor="middle" font-family="Helvetica" font-size="7.5" fill="${PC.muted}">${esc(shortNum(v))}</text>`; }
  items.forEach((it, i) => {
    const y = i * rowH + 6, lab = it.label.length > labW / 4.6 ? it.label.slice(0, Math.floor(labW / 4.6) - 1) + "…" : it.label;
    s += `<text x="${labW - 8}" y="${y + (rowH - 12) / 2 + 3.5}" text-anchor="end" font-family="Helvetica" font-size="8.5" fill="${PC.ink}">${esc(lab)}</text>`;
    it.values.forEach((v, j) => {
      const yy = y + j * (bh + gap), xa = Math.min(x(v), x0), w = Math.max(0.8, Math.abs(x(v) - x0));

      s += `<rect x="${xa}" y="${yy}" width="${w}" height="${bh}" rx="2" fill="${col}"/>`;
      if (j === it.values.length - 1 || o.labelAll) { const room = xa - labW > 46, lx = v >= 0 ? x(v) + 4 : (room ? xa - 4 : x0 + 4);
        s += `<text x="${lx}" y="${yy + bh / 2 + 3}" text-anchor="${v >= 0 || !room ? "start" : "end"}" font-family="Helvetica" font-size="7.8" fill="${PC.ink2}">${esc(NF0.format(Math.round(v)))}</text>`; }
    });
  });
  return s + `<line x1="${x0}" x2="${x0}" y1="0" y2="${H - 16}" stroke="${PC.muted}" stroke-width="0.8"/></svg>`;
}

      tr(T("Renteinntekter"), V("total.renteinn")), tr(T("Renteutgifter"), -V("total.renteut")), tr(T("Nettoinntekt næring"), V("total.netto"), true)], ["*", 80])]},
    {width: "*", stack: [P.h2(T("Fra skattemessig til driftsmessig resultat")), P.table(null, [
      tr(T("Driftsoverskudd, skattemessig"), doS), tr(T("Tillegg skattemessige avskrivninger"), V("total.avskr_skatt")), tr(T("Fradrag driftsmessige avskrivninger"), -V("total.avskr_drift")),
      tr(T("Korrigering beholdningsendring"), V("total.korr_beh")), tr(T("Driftsoverskudd, driftsmessig"), doS + V("total.korr_avskr") + V("total.korr_beh"), true)], ["*", 80]),
      P.h2(T("Nøkkeltall")), P.table(null, kpiRows(SHEET.total).concat(kpiRows(SHEET.faste).filter(r => r.fmt === "pct")).map(r => ({cells: [clean(LBL(r)), fmt(V(r.sheet + "." + r.id), r.fmt)]})), ["*", 60])]}], columnGap: 18});
  const fcol = groups => { const fr = [];
    groups.forEach(([l, f, pre]) => { SHEET.faste.rows.filter(r => r.t === "input" && r.id.startsWith(pre)).forEach(r => { const v = V("faste." + r.id); if (Math.abs(v) > 0.5) fr.push({cells: [clean(LBL(r)).replace(/^Innandørsmekanisering – /, ""), kr(v)], sub: true}); });
      if (V(f)) fr.push({cells: [T(l), kr(V(f))], sum: true}); }); return fr; };
  const fRight = fcol([["Innandørsmekanisering", "faste.innmek_sum", "innmek_"], ["Andre faste kostnader", "faste.andre_sum", "a_"]]);
  fRight.push({cells: [T("Faste kostnader"), kr(V("faste.faste_sum"))], sum: true});
  C.push({stack: [P.h2(T("Faste kostnader")), {columns: [
    {width: "*", stack: [P.table(null, fcol([["Maskinkostnader", "faste.maskin_sum", "m_"], ["Bygningskostnader", "faste.bygg_sum", "b_"]]), ["*", 70])]},
    {width: "*", stack: [P.table(null, fRight, ["*", 70])]}], columnGap: 18}], unbreakable: true});
  /* 5. Grovfôr */
  if (hasGF) {
    C.push(P.h1(T("Grovfôr")));
    C.push(P.tiles([{k: T("Korrigert grovfôrareal"), v: fmt(V("grovfor.da_vk"), "n1"), s: T("dekar")}, {k: T("Sum kuenheter"), v: fmt(V("grovfor.sum_ku"), "n1")},
      {k: T("Variabel grovfôrkostnad"), v: kr(V("grovfor.varkost_pr_da")), s: T("kr per dekar")}, {k: T("Maskinkostnader"), v: kr(V("grovfor.maskin_pr_da")), s: T("kr per dekar")}]));
    C.push(P.box(textFor("grovfor")));
    const sec = (from, to, skip) => { const out = []; let on = false; SHEET.grovfor.rows.forEach(r => { if (r.t === "head") { if (r.label.startsWith(from)) on = true; else if (to && r.label.startsWith(to)) on = false; return; }
      if (!on) return; const v = V("grovfor." + r.id); if (skip && Math.abs(v) < 0.005) return; out.push({cells: [clean(LBL(r)), fmt(v, r.fmt)]}); }); return out; };
    C.push({columns: [{width: "*", stack: [P.h2(T("Areal")), P.table(null, sec("1.", "4.", true), ["*", 60])]},
      {width: "*", stack: [P.h2(T("Kuenheter og grovfôrkostnad")), P.table(null, sec("4.", "5.", true), ["*", 70]), P.h2(T("Nøkkeltall")), P.table(null, sec("5.", null, false), ["*", 70])]}], columnGap: 18});
  }
  /* 6. Produksjonane */
  prods.forEach(p => {
    const k = p.key, n = V(k + ".n"), per = perTxt(p).replace(/^(per|pr) /, "");
    C.push(P.h1(SL(p, "title")));
    C.push({text: fmt(n, "n") + " " + SL(p, "unit_label") + "   ·   " + T("Regnskapsår {a}", {a: S.aar}), style: "small", margin: [0, -6, 0, 8]});
    const kp = kpiRows(p).filter(r => r.fmt !== "txt");
    C.push(P.tiles(kp.slice(0, 4).map(r => ({k: clean(LBL(r)), v: fmt(V(k + "." + r.id), r.fmt), s: unitTxt(r)}))));
    C.push(P.box(textFor(k), T("Vurdering")));
    const ur = unitRows(p).filter(r => isSumLbl(r.label) || Math.abs(V(k + "." + r.id)) > 0.005);
    const unitTable = P.table([T("Resultat"), T("per") + " " + per, T("Totalt")], ur.map(r => ({cells: [clean(LBL(r)), fmt(V(k + "." + r.id), r.fmt), kr(V(k + "." + r.id) * n)], sum: isSumLbl(r.label)})), ["*", 52, 62], {tight: true, mb: 6});
    const kpiTable = P.table([T("Nøkkeltall"), T("Verdi"), ""], kpiRows(p).map(r => ({cells: [clean(LBL(r)), fmt(V(k + "." + r.id), r.fmt), unitTxt(r)]})), ["*", "auto", 22], {numFrom: 1, tight: true, mb: 6});
    const costItems = unitRows(p).filter(r => /Variable kostnader/i.test(r.sec) && !/^Sum/.test(r.label)).map(r => ({label: clean(LBL(r)), values: [V(k + "." + r.id)]})).filter(x => Math.abs(x.values[0]) > 0.005);
    C.push({columns: [{width: "*", stack: [unitTable]}, {width: "*", stack: [kpiTable].concat(costItems.length ? [P.h2(T("Variable kostnader per") + " " + per + ", kr"), P.svg(barSvg(costItems, {width: 250, labelW: 110, bar: 7}), 250)] : [])}], columnGap: 18});
  });
  /* 7. Rekneskapstal */
  C.push(P.h1(T("Regnskapstall")));
  C.push(P.h2(T("Resultatregnskap etter kontogruppe")));
  const grp = {};
  Object.values(M.A).forEach(a => { const b = parseAcc(a.nr).base; if (b < 3000 || b > 8999) return; const g = String(b).slice(0, 2);
    const o = grp[g] || (grp[g] = {s: 0, d: 0}); o.s += -a.orig; o.d += -a.amt; });
  const gk = Object.keys(grp).sort(), drift = gk.filter(g => +g < 80), fin = gk.filter(g => +g >= 80);
  const gRow = g => ({cells: [g + " " + (KONTOPLAN.groups[g] || ""), kr(grp[g].s), kr(grp[g].d - grp[g].s), kr(grp[g].d)]});
  const sumS = drift.reduce((s, g) => s + grp[g].s, 0), sumD = drift.reduce((s, g) => s + grp[g].d, 0);
  C.push(P.table([T("Kontogruppe"), T("Skattemessig"), T("Korrigering"), T("Driftsmessig")],
    drift.map(gRow).concat([{sum: true, cells: [T("Driftsresultat"), kr(sumS), kr(sumD - sumS), kr(sumD)]}]).concat(fin.map(gRow)), ["*", 75, 70, 75]));
  C.push(P.h2(T("Fordeling av regnskapet")));
  const tOrder = [...prods.map(p => p.key), "FASTE", "INNMEK", "TOTAL", "NONE"].filter(t => M.tsum[t]);
  C.push(P.table([T("Mottaker"), T("Inntekter"), T("Kostnader")], tOrder.map(t => ({cells: [t === "NONE" ? T("Ikke med i analysen") : PN(t), kr(M.tsum[t].inn), kr(M.tsum[t].kost)]})), ["*", 90, 90]));
  /* 8. Korrigeringar */
  C.push(P.h1(T("Korrigeringer og forutsetninger")));
  const L = lagerRows().filter(l => Math.abs(l.korr) > 0.5), AV = avskrRows().filter(x => Math.abs(x.diff) > 0.5);
  C.push(P.h2(T("Varelager og buskap")));
  C.push(L.length ? P.table([T("Konto"), T("Skattemessig") + " 1.1.", "31.12.", T("Driftsmessig") + " 1.1.", "31.12.", T("Korrigering")],
    L.map(l => ({cells: [l.r.nr + "  " + l.r.navn, kr(l.r.ib), kr(l.r.ub), kr(l.ibD), kr(l.ubD), kr(l.korr)]})).concat([{sum: true, cells: [T("Sum"), "", "", "", "", kr(L.reduce((s, l) => s + l.korr, 0))]}]), ["*", 52, 52, 56, 56, 56]) : P.none());
  C.push(P.h2(T("Avskrivninger")));
  C.push(AV.length ? P.table([T("Konto"), T("Skattemessig"), T("Driftsmessig"), T("Grunnlag")],
    AV.map(x => ({cells: [x.r.nr + "  " + x.r.navn, kr(x.skatt), kr(x.drift), x.verdi && x.levetid && !x.manual ? kr(x.verdi) + " / " + x.levetid + " " + T("år") : T("manuelt")]})), ["*", 65, 65, 95]) : P.none());
  const mv = S.moves.filter(x => x.fra && x.til && num(x.belop));
  C.push(P.h2(T("Flyttede beløp")));
  C.push(mv.length ? P.table([T("Fra"), T("Til"), T("Beløp"), T("Forklaring")], mv.map(x => ({cells: [x.fra + "  " + kontoNavn(x.fra), x.til + "  " + kontoNavn(x.til), kr(num(x.belop)), x.tekst || ""]})), ["*", "*", 50, "*"], {numFrom: 2}) : P.none());
  const man = Object.keys(M.A).filter(nr => mapFor(nr)).sort(byNr);
  C.push(P.h2(T("Manuelle koblinger")));
  C.push(man.length ? P.table([T("Konto"), T("Kobling")], man.map(nr => { const x = mapFor(nr); return {cells: [nr + "  " + kontoNavn(nr), PN(x.t1) + (x.t2 ? ` ${100 - num(x.p2)} %  ·  ${PN(x.t2)} ${num(x.p2)} %` : "")]}; }), ["*", "*"], {numFrom: 9}) : P.none());
  const ov = Object.entries(S.overrides).filter(([f, v]) => v != null && v !== "" && ROW[f]);
  if (ov.length) { C.push(P.h2(T("Overstyrte tall"))); C.push(P.table(null, ov.map(([f, v]) => ({cells: [SL(SHEET[f.split(".")[0]], "sheet") + ": " + clean(LBL(ROW[f])), fmt(num(v), ROW[f].fmt)]})), ["*", 80])); }
  if (prods.length) { C.push({unbreakable: true, stack: [P.h2(T("Fordelingsnøkler")), P.table([T("Produksjon"), T("Fellespott"), T("Maskinkostnader"), T("Innandørsmekanisering")],
      prods.map(p => ({cells: [SL(p, "sheet"), pct((M.poolKey[p.key] || 0) / 100), pct((M.maskinKey[p.key] || 0) / 100), M.innmekKeys.includes(p.key) ? pct((M.innmekKey[p.key] || 0) / 100) : "–"]})), ["*", 80, 90, 110])]}); }
  return {
    pageSize: "A4", pageMargins: [40, 54, 40, 46], content: C,
    info: {title: T("Nøkkeltallsanalyse jordbruk") + " – " + (S.klient || ""), author: S.utarbeidd || ""},
    background: page => page === 1 ? {canvas: [{type: "rect", x: 0, y: 0, w: 595.28, h: 215, color: PC.accent}]} : null,
    header: page => page === 1 ? null : {margin: [40, 22, 40, 0], columns: [{text: T("Nøkkeltallsanalyse jordbruk") + "  ·  " + (S.klient || ""), style: "hdr"}, {text: T("Regnskapsår {a}", {a: S.aar}), style: "hdr", alignment: "right"}]},
    footer: (page, count) => ({margin: [40, 14, 40, 0], columns: [{text: T("Utarbeidet") + " " + new Date().toLocaleDateString("nb-NO") + (S.utarbeidd ? "  ·  " + S.utarbeidd : ""), style: "hdr"},
      {text: `${T("Side")} ${page} ${T("av")} ${count}`, style: "hdr", alignment: "right"}]}),
    defaultStyle: {font: "Roboto", fontSize: 9, color: PC.ink, lineHeight: 1.2},
    styles: {
      h1: {fontSize: 18, bold: true, color: PC.accent, margin: [0, 0, 0, 10]},
      h2: {fontSize: 10.5, bold: true, color: PC.accent, margin: [0, 6, 0, 5]},
      kicker: {fontSize: 8, bold: true, color: PC.accent, characterSpacing: 1.2, margin: [0, 0, 0, 6]},
      tileK: {fontSize: 7.5, color: PC.muted}, tileV: {fontSize: 15, bold: true, margin: [0, 2, 0, 0]}, tileS: {fontSize: 7.5, color: PC.ink2},
      th: {fontSize: 7.8, bold: true, color: PC.accent}, td: {fontSize: 8.6}, tdSub: {fontSize: 8.3, color: PC.ink2}, tdSum: {fontSize: 8.6, bold: true},
      body: {fontSize: 9.2, lineHeight: 1.3}, boxT: {fontSize: 9.5, bold: true, color: PC.accent, margin: [0, 0, 0, 4]},
      small: {fontSize: 8, color: PC.muted}, hdr: {fontSize: 7.5, color: PC.muted}, cardT: {fontSize: 10.5, bold: true, color: PC.accent},
    },
  };
}

/* ================================================================ INNSTILLINGER */
function renderSettings(m) {
  const f = (SET.filter || "").toLowerCase(), onlyMan = !!SET.onlyManual;
  const inSb = new Set(S.sb.map(r => r.nr));
  const inRange = nr => { const b = parseAcc(nr).base; return b >= 3000 && b <= 8999; };
  const all = [...new Set([...KONTOPLAN.accounts.map(a => a[0]).filter(inRange), ...[...inSb].filter(inRange)])].sort(byNr);
  const target = nr => (mapFor(nr) ? mapFor(nr).t1 : autoTarget(nr));
  const shown = all.filter(nr => (!onlyMan || mapFor(nr)) && (!f || nr.includes(f) || kontoNavn(nr).toLowerCase().includes(f) || PN(target(nr)).toLowerCase().includes(f)));
  const groups = {}; shown.forEach(nr => { const g = String(parseAcc(nr).base).slice(0, 2); (groups[g] = groups[g] || []).push(nr); });
  const nMan = Object.keys(SET.map).filter(mapFor).length;
  m.innerHTML = `<div class="pagehead"><div><div class="k">${T("Innstillinger")}</div><h1>${T("Kobling konto → produksjon")}</h1></div><span class="grow"></span>
    <span class="pill acc">${nMan} ${T("manuelle")}</span></div>
    <div class="card"><div class="row"><input class="search" id="sflt" placeholder="${T("Søk konto eller navn")}" value="${esc(SET.filter || "")}">
      <label class="row sm"><input type="checkbox" id="onlyMan" ${onlyMan ? "checked" : ""}> ${T("Vis bare manuelle")}</label><span class="grow"></span>
      <button class="btn sm ghost" id="resetMap">${T("Tilbakestill alle")}</button></div></div>
    ${Object.keys(groups).sort().map(g => `<details class="grp" data-g="${g}" ${f || onlyMan || (SET.openGroups || []).includes(g) ? "open" : ""}>
      <summary>${g} ${esc(KONTOPLAN.groups[g] || "")} <span class="grow"></span><span class="muted sm">${groups[g].length}</span></summary><div class="inner"></div></details>`).join("")}`;
  const fill = d => { const g = d.dataset.g, box = $(".inner", d);
    box.innerHTML = groups[g].map(nr => { const x = mapFor(nr) || {};
      return `<div class="maprow ${x.t1 ? "manual" : ""}" data-nr="${esc(nr)}"><span class="nr acc">${esc(nr)}${inSb.has(nr) ? " •" : ""}</span><span>${esc(kontoNavn(nr))}</span>
        <select class="sel" data-f="t1">${targetOptions(x.t1 || "", autoTarget(nr))}</select>
        <select class="sel" data-f="t2"><option value="">${T("Del med")} …</option>${PKEYS.concat(Object.keys(SPECIAL_LABEL)).map(k => `<option value="${k}" ${k === x.t2 ? "selected" : ""}>${esc(PN(k))}</option>`).join("")}</select>
        <input class="inp num" data-f="p2" value="${x.t2 ? num(x.p2) : ""}" placeholder="%" ${x.t2 ? "" : "disabled"}></div>`; }).join("");
    $$("select, input", box).forEach(el => el.onchange = e => { setMap(e.target.closest(".maprow").dataset.nr, e.target.dataset.f, e.target.value);
      if (S.sb.length) compute(); fill(d); renderChrome(); $(".pill.acc", m).textContent = Object.keys(SET.map).filter(mapFor).length + " " + T("manuelle"); }); };
  $$("details.grp", m).forEach(d => { if (d.open) fill(d); d.ontoggle = () => { if (d.open) fill(d);
    const o = new Set(SET.openGroups || []); d.open ? o.add(d.dataset.g) : o.delete(d.dataset.g); SET.openGroups = [...o]; saveSet(); }; });
  $("#sflt").oninput = e => { SET.filter = e.target.value; const pos = e.target.selectionStart; renderSettings(m); const n = $("#sflt"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#onlyMan").onchange = e => { SET.onlyManual = e.target.checked; saveSet(); renderSettings(m); };
  $("#resetMap").onclick = () => { if (confirm(T("Vil du fjerne alle manuelle koblinger?"))) { SET.map = {}; saveSet(); render(); } };
}

/* ================================================================ HENDINGAR */
$("#btnPrev").onclick = () => go(S.node - 1);
$("#btnNext").onclick = () => { if (S.node === NODES.length - 1) downloadPdf(); else go(S.node + 1); };
$("#brand").onclick = () => { VIEW = "wizard"; render(); };
$("#btnSettings").onclick = () => { VIEW = VIEW === "settings" ? "wizard" : "settings"; render(); window.scrollTo({top: 0}); };
$$("#langSeg button").forEach(b => b.onclick = () => { LANG = SET.lang = b.dataset.l; saveSet(); rerender(); });
$("#btnTheme").onclick = () => { SET.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; saveSet(); rerender(); };
$("#btnMenu").onclick = e => { e.stopPropagation(); $("#menuProj").classList.toggle("open"); };
document.addEventListener("click", () => $("#menuProj").classList.remove("open"));
$("#mSave").onclick = () => { const blob = new Blob([JSON.stringify({prosjekt: S, koblinger: SET.map}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `analyse_${(S.klient || "klient").replace(/\W+/g, "_")}_${S.aar}.json`; a.click(); };
$("#mOpen").onclick = () => $("#fileProject").click();
$("#fileProject").onchange = e => { const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); S = Object.assign(freshState(), d.prosjekt || d); if (d.koblinger) { SET.map = d.koblinger; saveSet(); } save(); VIEW = "wizard"; render(); } catch (err) { alert(T("Kunne ikke lese fila.")); } }); };
$("#mReset").onclick = () => { if (confirm(T("Vil du slette arbeidet og starte på nytt?"))) { S = freshState(); save(); VIEW = "wizard"; render(); } };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!SET.theme) rerender(); });
render();
</script>
