<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface-2:#f8f9f7; --line:#dfe3dc; --line-2:#eceee9;
  --ink:#1b211c; --ink-2:#4d564f; --ink-3:#7a837c;
  --accent:#2e5e45; --accent-2:#3d7a5a; --accent-soft:#e3efe7; --accent-ink:#ffffff;
  --input-bg:#fffbe6; --input-line:#e8d27a;
  --warn:#9a5b00; --warn-soft:#fff3dc; --bad:#b3261e; --bad-soft:#fde8e6; --good:#1d6b3a; --good-soft:#e2f3e8;
  --series-1:#2a78d6; --series-2:#eb6834;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,20,.06),0 4px 14px rgba(20,30,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app-head{background:var(--accent);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.app-head h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.1px}
.app-head .meta{opacity:.85;font-size:13px}
.app-head .spacer{flex:1}
.app-head .hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.app-head .hbtn:hover{background:rgba(255,255,255,.22)}
.stepper{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.step{display:flex;align-items:center;gap:10px;padding:14px 18px;border:0;background:none;cursor:pointer;color:var(--ink-3);white-space:nowrap;border-bottom:3px solid transparent}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);color:var(--ink-2);font-weight:650;font-size:13px}
.step.done .num{background:var(--accent-soft);color:var(--accent)}
.step.active{color:var(--ink);border-bottom-color:var(--accent)}
.step.active .num{background:var(--accent);color:#fff}
.step .lbl{font-weight:560}
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:18px 0 8px;font-size:15px}
.lead{color:var(--ink-2);margin:0 0 14px;max-width:880px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:560}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big-import{display:flex;gap:16px;flex-wrap:wrap}
.import-tile{flex:1 1 300px;border:1px dashed var(--line);border-radius:var(--radius);padding:18px;background:var(--surface-2)}
.import-tile h3{margin:0 0 6px}
.import-tile p{margin:0 0 12px;color:var(--ink-2);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;min-width:160px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--ink-3)}
.tile .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--ink-2)}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:560px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#eef1ec;text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap;color:var(--ink-2);font-size:12px}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:hover td{background:#fafbf8}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sum td{font-weight:650;background:#f3f6f2}
table.t tr.grp td{background:var(--accent-soft);font-weight:650;color:var(--accent)}
table.t input.num,table.t input.txt,table.t select{border:1px solid var(--input-line);background:var(--input-bg);border-radius:6px;padding:4px 7px;width:120px;text-align:right;font-variant-numeric:tabular-nums}
table.t input.txt{text-align:left;width:220px}
table.t select{text-align:left;width:auto;max-width:230px;background:#fff;border-color:var(--line)}
table.t input.pct{width:72px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:9px;padding:10px 14px;margin:10px 0;font-size:13px}
.notice.warn{background:var(--warn-soft);color:#5d3a00}
.notice.ok{background:var(--good-soft);color:#174d2b}
.notice.info{background:#eaf2fb;color:#1b4470}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:560}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:260px}
.footer-nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 24px;display:flex;gap:12px;align-items:center;z-index:5}
.footer-nav .spacer{flex:1}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.prodcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface-2)}
.prodcard.on{border-color:var(--accent-2);background:var(--accent-soft)}
.prodcard .nm{font-weight:620}
.prodcard .sub{font-size:12px;color:var(--ink-3)}
details.prod{border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#fff}
details.prod>summary{cursor:pointer;padding:10px 14px;font-weight:620;display:flex;gap:10px;align-items:center}
details.prod>summary::-webkit-details-marker{display:none}
details.prod>summary:before{content:"▸";color:var(--ink-3)}
details.prod[open]>summary:before{content:"▾"}
details.prod .inner{padding:0 14px 14px}
.formula{font-size:11.5px;color:var(--ink-3);max-width:520px}
.ovr{color:var(--warn);font-weight:650}
.hidden{display:none!important}
.preview-shell{background:#6b716c;border-radius:var(--radius);padding:22px;overflow:auto;max-height:78vh}
.preview-shell .page{margin:0 auto 22px;box-shadow:0 4px 24px rgba(0,0,0,.35)}

.page{width:210mm;height:296.6mm;background:#fff;color:#1b211c;position:relative;overflow:hidden;padding:15mm 15mm 14mm;font:9.5pt/1.4 Arial,Helvetica,sans-serif;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.page .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #2e5e45;padding-bottom:5px;margin-bottom:10px}
.page .ph .t{font-size:15pt;font-weight:700;color:#2e5e45}
.page .ph .m{font-size:8pt;color:#6b746d;text-align:right}
.page .pf{position:absolute;left:15mm;right:15mm;bottom:8mm;font-size:7.5pt;color:#8a928b;display:flex;justify-content:space-between;border-top:1px solid #e3e6e1;padding-top:4px}
.page h4{font-size:10.5pt;margin:12px 0 5px;color:#2e5e45}
.page p{margin:0 0 6px}
.page .ptiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0 8px}
.page .ptile{border:1px solid #dfe3dc;border-radius:6px;padding:7px 9px;background:#f8f9f7}
.page .ptile .k{font-size:7.5pt;color:#6b746d;line-height:1.25}
.page .ptile .v{font-size:13pt;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.page .ptile .s{font-size:7.5pt;color:#4d564f}
.page table.r{width:100%;border-collapse:collapse;font-size:8.3pt}
.page table.r th{text-align:left;font-weight:700;border-bottom:1.2px solid #2e5e45;padding:3px 4px;color:#2e5e45;font-size:7.8pt}
.page table.r td{padding:2.4px 4px;border-bottom:1px solid #eceee9}
.page table.r td.n,.page table.r th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.page table.r tr.s td{font-weight:700;background:#f3f6f2;border-bottom:1px solid #cfd6cd}
.page table.r tr.h td{font-weight:700;color:#2e5e45;padding-top:6px;border-bottom:none}
.page .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.page .box{border-left:3px solid #2e5e45;background:#f4f7f3;padding:7px 10px;border-radius:0 6px 6px 0;margin:8px 0}
.page .cover-band{background:#2e5e45;color:#fff;margin:-15mm -15mm 0;padding:24mm 15mm 12mm}
.page .cover-band .over{font-size:9pt;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}
.page .cover-band h1{font-size:26pt;margin:4px 0 2px}
.page .cover-band .who{font-size:13pt;opacity:.95}
.page .legend{display:flex;gap:14px;font-size:7.8pt;color:#4d564f;margin:2px 0 4px}
.page .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.page .muted{color:#7a837c}
@media print{
  body{background:#fff}
  .app-head,.stepper,.footer-nav,.no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  .card{border:0;box-shadow:none;padding:0;margin:0}
  .preview-shell{background:none;padding:0;max-height:none;overflow:visible}
  .preview-shell .page{box-shadow:none;margin:0}
  @page{size:A4;margin:0}
}
@media (max-width:700px){
  .wrap{padding:16px 16px 90px}
  .app-head{padding:12px 16px}
  .card{padding:16px}
  .search{min-width:0;width:100%}
}
</style>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NF0 = new Intl.NumberFormat("nb-NO", {maximumFractionDigits: 0});

const NF2 = new Intl.NumberFormat("nb-NO", {minimumFractionDigits: 2, maximumFractionDigits: 2});
function fmt(v, f) {
  if (typeof v === "string") return esc(v);
  if (v == null || !isFinite(v)) return "–";
  if (Math.abs(v) < 1e-9) return "–";
  switch (f) {
    case "pct": return NF1.format(v * 100) + " %";
    case "kr2": case "n2": return NF2.format(v);
    case "n1": return NF1.format(v);
    default: return NF0.format(v);
  }
}
const kr = v => fmt(v, "kr");
function num(s) {
  if (typeof s === "number") return s;
  if (s == null) return 0;
  s = String(s).trim().replace(/\s| /g, "").replace(/kr$/i, "");
  if (/^-?[\d.]+,\d+$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else s = s.replace(",", ".");
  const v = parseFloat(s);
  return isFinite(v) ? v : 0;
}
function parseAcc(nr) {
  const p = String(nr).trim().split(".");
  return {nr: String(nr).trim(), base: parseInt(p[0], 10), avd: p[1] || "", suf: p[2] || ""};
}
const ruleCache = {};
function rules(str) {
  if (ruleCache[str]) return ruleCache[str];
  const inc = [], exc = [];
  String(str || "").split(",").map(x => x.trim()).filter(Boolean).forEach(tok => {
    const neg = tok.startsWith("!"); if (neg) tok = tok.slice(1);
    const m = tok.match(/^(\d+)(?:-(\d+))?/); if (!m) return;
    const r = [parseInt(m[1], 10), parseInt(m[2] || m[1], 10)];
    (neg ? exc : inc).push(r);
  });
  return (ruleCache[str] = {inc, exc});
}
function inRule(n, str) {
  const r = rules(str);
  return r.inc.some(([a, b]) => n >= a && n <= b) && !r.exc.some(([a, b]) => n >= a && n <= b);

  if (!hit) return null;
  return hit[1] + (a.avd ? "." + a.avd : "") + (a.suf ? "." + a.suf : "");

function sbIsResult(r) { return parseAcc(r.nr).base >= 3000; }

/** Steg 2: driftsmessige lagerverdiar */
function lagerRows() {
  return S.sb.filter(r => { const b = parseAcc(r.nr).base; return b >= 1400 && b <= 1499; }).map(r => {
    const L = S.lager[r.nr] || {};
    const ibD = L.ibD ?? r.ib, ubD = L.ubD ?? r.ub;
    const endS = r.ub - r.ib, endD = ubD - ibD;
    return {r, ibD, ubD, endS, endD, korr: endD - endS, beh: behKonto(r.nr)};
  });
}
/** Steg 3: driftsmessige avskrivingar */
function avskrRows() {
  return S.sb.filter(r => { const b = parseAcc(r.nr).base; return b >= 6000 && b <= 6099; }).map(r => {
    const A = S.avskr[r.nr] || {};
    let drift = r.ub;
    if (A.verdi > 0 && A.levetid > 0) drift = A.verdi / A.levetid;
    if (A.drift != null && A.drift !== "") drift = num(A.drift);
    return {r, skatt: r.ub, drift, verdi: A.verdi, levetid: A.levetid, manual: A.drift != null && A.drift !== "", diff: drift - r.ub};
  });
}
/** Resultatkontoar etter alle korrigeringar: {nr: {orig, amt, navn, m1, m2}} */
function adjustedAccounts() {
  const A = {};
  S.sb.filter(sbIsResult).forEach(r => A[r.nr] = {nr: r.nr, navn: r.navn, orig: r.ub, amt: r.ub, m1: r.m1 || 0, m2: r.m2 || 0, notes: []});
  const ensure = nr => A[nr] || (A[nr] = {nr, navn: kontoNavn(nr), orig: 0, amt: 0, m1: 0, m2: 0, notes: []});
  lagerRows().forEach(l => { if (l.beh && Math.abs(l.korr) > 0.004) { const a = ensure(l.beh); a.amt += -l.korr; a.notes.push("Driftsmessig lagerverdi"); } });
  avskrRows().forEach(x => { if (Math.abs(x.diff) > 0.004) { const a = ensure(x.r.nr); a.amt = x.drift; a.notes.push("Driftsmessig avskriving"); } });
  S.moves.forEach(m => {
    const v = num(m.belop); if (!m.fra || !m.til || !v) return;
    const f = ensure(m.fra), t = ensure(m.til);
    const sg = f.amt < 0 ? -1 : 1;
    f.amt -= sg * v; t.amt += sg * v;
    f.notes.push("Flytta til " + m.til); t.notes.push("Flytta frå " + m.fra);
  });
  return A;
}

function candidates(nr) {
  const a = parseAcc(nr);
  if (a.suf) { const s = SPEC.suffixProd.find(([r]) => inRule(parseInt(a.suf, 10), r)); if (s) return s[1]; }
  const h = SPEC.accountProd.find(([r]) => inRule(a.base, r));
  if (h) return h[1];
  if (a.base >= 3000 && a.base <= 7999) return ["FASTE"];
  return ["NONE"];
}

function prodInputVal(full, derived) {
  if (S.prodInputs[full] != null && S.prodInputs[full] !== "") return num(S.prodInputs[full]);
  if (derived[full] != null) return derived[full];
  return 0;
}

function deriveInputs(A) {
  const D = {};
  const lag = {}; lagerRows().forEach(l => lag[l.r.nr] = l);
  DERIVE.forEach(([full, base, suf, what, field]) => {
    let sum = 0, hit = false;
    if (what === "end") {
      Object.values(A).forEach(a => { const p = parseAcc(a.nr); if (String(p.base) === base && (!suf || (p.suf && inRule(+p.suf, suf)))) { sum += Math.abs(a[field] || 0); hit = true; } });
    } else {
      S.sb.forEach(r => { const p = parseAcc(r.nr); if (String(p.base) === base && (!suf || (p.suf && inRule(+p.suf, suf)))) {
        hit = true;
        if (field === "kr") { const l = lag[r.nr]; sum += what === "ib" ? (l ? l.ibD : r.ib) : (l ? l.ubD : r.ub); }
        else sum += what === "ib" ? (r.m1ib || 0) : (r.m1ub || 0);
      } });
    }
    if (hit) D[full] = sum;
  });
  return D;
}

/** Bygg ein evaluator over eit sett input-verdiar */
function engine(INP, active, FORCE = {}) {
  const memo = {};
  const ACTIVE = k => (active.has(k) ? 1 : 0);
  function V(full) {
    if (full in memo) return memo[full];
    memo[full] = 0; // vern mot sirkel
    let v;
    if (S.overrides[full] != null && S.overrides[full] !== "") v = num(S.overrides[full]);
    else if (full in FORCE) v = FORCE[full];
    else { const r = ROW[full]; if (!r) v = 0; else if (r.t === "input") v = INP[full] ?? 0;
      else { try { v = COMPILED[full](V, FUNCS.DIV, FUNCS.IF, FUNCS.MAX, FUNCS.MIN, FUNCS.ABS, FUNCS.ROUND, FUNCS.SUM, ACTIVE); } catch (e) { v = 0; } } }
    if (typeof v === "number" && !isFinite(v)) v = 0;
    return (memo[full] = v);
  }
  return V;
}

function normKey(obj, keys) {
  const out = {}; let s = 0;
  keys.forEach(k => { out[k] = Math.max(0, obj[k] || 0); s += out[k]; });
  keys.forEach(k => out[k] = s ? out[k] / s * 100 : (keys.length ? 100 / keys.length : 0));
  return out;
}

let MODEL = null;
function compute() {
  const A = adjustedAccounts();
  const derived = deriveInputs(A);
  // 1. produksjonsinput
  const INP = {};
  for (const [full, r] of Object.entries(ROW)) if (r.t === "input" && (r.kind === "prod" || r.kind === "info")) INP[full] = prodInputVal(full, derived);
  ["total.do_andre"].forEach(f => INP[f] = prodInputVal(f, derived));
  // 2. aktive produksjonar
  const nAny = SPEC.prodKeys.some(k => INP[k + ".n"] > 0);
  const firstAmt = {};
  Object.values(A).forEach(a => { if (!a.amt) return; const c = candidates(a.nr).find(x => PNAME[x]); if (c) firstAmt[c] = (firstAmt[c] || 0) + Math.abs(a.amt); });
  const active = new Set(SPEC.prodKeys.filter(k => S.active[k] != null ? S.active[k] : (nAny ? INP[k + ".n"] > 0 : (firstAmt[k] || 0) > 0)));
  // 3. førebels motor for kueiningar / areal (fordelingsnøklar)
  const V0 = engine(INP, active);
  const autoPool = {}, autoMaskin = {}, autoInnmek = {};
  const act = [...active];
  act.forEach(k => {
    const g = SHEET[k].group;
    autoPool[k] = g === "grovfor" ? V0(k + ".kueiningar") : 0;
    autoInnmek[k] = g === "grovfor" ? V0(k + ".kueiningar") : (g === "kraftfor" ? 5 : 0);
    autoMaskin[k] = g === "grovfor" ? V0(k + ".kueiningar") * 4 : (g === "plante" ? (k === "agurk" || k === "tomat" ? V0(k + ".n") / 2000 : V0(k + ".n") * 0.5) : 2);
  });
  const poolKeys = act, innmekKeys = act.filter(k => SHEET[k].group !== "plante");
  const autoP = normKey(autoPool, poolKeys), autoI = normKey(autoInnmek, innmekKeys), autoM = normKey(autoMaskin, act);
  Object.keys(autoM).forEach(k => autoM[k] *= 0.95);
  const pick = (store, auto, keys) => { const o = {}; keys.forEach(k => o[k] = store && store[k] != null && store[k] !== "" ? num(store[k]) : auto[k]); return o; };
  const poolKey = pick(S.poolKey, autoP, poolKeys), innmekKey = pick(S.innmekKey, autoI, innmekKeys), maskinKey = pick(S.maskinKey, autoM, act);
  // 4. fordel kontoar
  const contrib = {}; // full -> [{nr, amt}]
  const add = (full, nr, v) => { INP[full] = (INP[full] || 0) + v; (contrib[full] = contrib[full] || []).push({nr, v}); };
  const krRows = {};
  SPEC.prods.forEach(p => krRows[p.key] = p.rows.filter(r => r.t === "input" && ["tilskot", "inn", "kost", "gf"].includes(r.kind)));
  const fasteRows = SHEET.faste.rows.filter(r => r.t === "input" && r.acc);
  function toProd(k, nr, amt) {
    const base = parseAcc(nr).base;
    let row = krRows[k].find(r => r.acc && inRule(base, r.acc));
    if (!row) row = krRows[k].find(r => r.id === (base < 4000 ? "andre_inn" : "andre_kost"));
    add(k + "." + row.id, nr, row.sign * amt);
  }
  function toFaste(nr, amt) {
    const base = parseAcc(nr).base;
    const row = fasteRows.find(r => inRule(base, r.acc)) || fasteRows.find(r => r.id === "a_admin");
    add("faste." + row.id, nr, row.sign * amt);
  }
  function toTotal(nr, amt) {
    const b = parseAcc(nr).base;
    if (b >= 8000 && b <= 8099) add("total.renteinn", nr, -amt);
    else if (b >= 8100) add("total.renteut", nr, amt);
    else if (b >= 3400 && b <= 3499) add("total.tilskot_ufordelt", nr, -amt);
    else if (b < 4000) add("total.andre_inn", nr, -amt);
    else add("total.andre_var", nr, amt);
  }
  const alloc = {}; // nr -> [{t, share}]
  let innmekTotal = 0, ikkjeMed = 0;
  const poolSum = {}; let poolTotal = 0;
  const resolve = nr => {
    const c = candidates(nr);
    const prodC = c.filter(x => PNAME[x]);
    const hit = prodC.find(x => active.has(x));
    if (hit) return hit;
    const sp = c.find(x => SPECIAL[x]);
    if (sp) return sp;
    return prodC.length ? (active.size ? "POOL" : prodC[0]) : "NONE";
  };
  Object.values(A).forEach(a => {
    if (!a.amt) return;
    const b = parseAcc(a.nr).base;
    if (b < 3000 || b > 8999) return;
    const man = S.assign[a.nr];
    let parts;
    if (man && man.t1) { const p2 = man.t2 ? Math.min(100, Math.max(0, num(man.p2))) : 0; parts = [{t: man.t1, s: 1 - p2 / 100}]; if (p2) parts.push({t: man.t2, s: p2 / 100}); }
    else parts = [{t: resolve(a.nr), s: 1}];
    alloc[a.nr] = parts;
    parts.forEach(({t, s}) => {
      const v = a.amt * s; if (!v) return;
      if (PNAME[t]) { if (active.has(t)) toProd(t, a.nr, v); else ikkjeMed += v; }
      else if (t === "POOL") { poolTotal += v; poolKeys.forEach(k => { const sh = (poolKey[k] || 0) / 100; if (sh) { toProd(k, a.nr, v * sh); poolSum[k] = (poolSum[k] || 0) + v * sh; } }); }
      else if (t === "FASTE") toFaste(a.nr, v);
      else if (t === "INNMEK") innmekTotal += v;
      else if (t === "TOTAL") toTotal(a.nr, v);
      else if (b <= 7999) ikkjeMed += v;
    });
  });
  innmekKeys.forEach(k => add("faste.innmek_" + k, "INNMEK", innmekTotal * (innmekKey[k] || 0) / 100));
  act.forEach(k => INP["faste.pct_" + k] = (maskinKey[k] || 0) / 100);
  // 5. skattemessige kontrolltal
  let doSkatt = 0, avskrS = 0, avskrD = 0, behS = 0, behD = 0;
  Object.values(A).forEach(a => {
    const b = parseAcc(a.nr).base;
    if (b >= 3000 && b <= 7999) doSkatt += -a.orig;
    if (b >= 6000 && b <= 6099) { avskrS += a.orig; avskrD += a.amt; }
    if (inRule(b, BEH_RULE)) { behS += -a.orig; behD += -a.amt; }
  });
  INP["total.avskr_skatt"] = avskrS; INP["total.beh_skatt"] = behS; INP["total.beh_drift"] = behD; INP["total.do_skatt_rekneskap"] = doSkatt;
  const FORCE = {"total.avskr_drift": avskrD};
  const V = engine(INP, active, FORCE);
  const poolKeySum = poolKeys.reduce((s, k) => s + (poolKey[k] || 0), 0);
  const innmekKeySum = innmekKeys.reduce((s, k) => s + (innmekKey[k] || 0), 0);
  MODEL = {A, INP, V, active, contrib, alloc, poolKey, maskinKey, innmekKey, poolKeys, innmekKeys, autoP, autoM, autoI,
    poolTotal, innmekTotal, ikkjeMed, derived, poolKeySum, innmekKeySum, resolve};
  return MODEL;
}

function importFile(file) {
  if (!file) return;
  if (typeof XLSX === "undefined") { alert("Fillesaren (SheetJS) er ikkje lasta – sjekk internettilgang."); return; }
  file.arrayBuffer().then(buf => {
    const isText = /\.(csv|txt)$/i.test(file.name);
    const wb = XLSX.read(buf, {type: "array", raw: isText});
    const sh = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sh, {header: 1, defval: "", raw: true});
    let hi = rows.findIndex(r => r.some(c => /konto/i.test(String(c))) && r.some(c => /saldo|ub|utg|beløp|belop/i.test(String(c))));
    if (hi < 0) hi = 0;
    const H = rows[hi].map(c => String(c).toLowerCase());
    const col = (...res) => { for (const re of res) { const i = H.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
    let cNr = col(/^konto(nr|nummer)?$|kontonummer|^nr|^konto$/); if (cNr < 0) cNr = col(/konto/);
    let cNavn = col(/navn|namn|beskrivelse|tekst/);
    const cIb = col(/inng|^ib$|opening/), cUb = col(/utg/, /^ub$|closing/, /^saldo$/), cEnd = col(/endring|bevegelse|periode/, /beløp|belop/);
    const cM1 = col(/mengde ?1|antall|mengde$/), cM2 = col(/mengde ?2/);
    const sb = [];
    rows.slice(hi + 1).forEach(r => {
      let raw = String(r[cNr] ?? "").trim(); if (!raw) return;
      let nr = raw.match(/^\d{4}(\.\d+){0,2}/); if (!nr) return; nr = nr[0];
      if (typeof r[cNr] === "number" && /^\d{4}\.\d$/.test(nr)) nr += "0"; // 3454.2 -> 3454.20
      let navn = cNavn >= 0 ? String(r[cNavn]).trim() : raw.replace(nr, "").trim();
      const ib = cIb >= 0 ? num(r[cIb]) : 0; let ub = cUb >= 0 ? num(r[cUb]) : NaN;
      if (!isFinite(ub)) ub = ib + (cEnd >= 0 ? num(r[cEnd]) : 0);
      const base = parseInt(nr, 10);
      const m1 = cM1 >= 0 ? num(r[cM1]) : 0, m2 = cM2 >= 0 ? num(r[cM2]) : 0;
      sb.push(base >= 3000 ? {nr, navn: navn || kontoNavn(nr), ib: 0, ub, m1, m2}
                           : {nr, navn: navn || kontoNavn(nr), ib, ub, m1ib: 0, m1ub: m1, m1: 0, m2: 0});
    });
    if (!sb.length) { alert("Fann ingen kontoar i fila. Sjekk at fila har kolonnar for konto og saldo."); return; }
    const keep = {klient: S.klient, utarbeidd: S.utarbeidd, aar: S.aar};
    S = freshState(); Object.assign(S, keep);
    S.sb = sb; S.source = file.name; save(); render();
  }).catch(() => alert("Kunne ikkje lese fila."));
}

function hbar(items, opt = {}) {
  // items: [{label, values:[v1,v2?]}]; series: [{name,color}]
  const series = opt.series || [{name: "", color: "var(--series-1)"}];
  const W = opt.width || 640, labW = opt.labelWidth || 170, rowH = series.length > 1 ? 30 : 20, pad = 6, valW = 74;
  const H = items.length * rowH + 24;
  const all = items.flatMap(i => i.values);
  const rawMax = Math.max(0, ...all), rawMin = Math.min(0, ...all);
  const step = niceStep((rawMax - rawMin) / 4 || 1);
  const max = Math.ceil(rawMax / step) * step, min = Math.floor(rawMin / step) * step;
  const span = (max - min) || 1, plotW = W - labW - valW;
  const x = v => labW + (v - min) / span * plotW;
  const x0 = x(0);
  const colors = {"var(--series-1)": "#2a78d6", "var(--series-2)": "#eb6834"};
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial, sans-serif" font-size="10">`;
  // rutenett
  for (let v = min; v <= max + step / 2; v += step) { const xx = x(v);
    svg += `<line x1="${xx}" x2="${xx}" y1="2" y2="${H - 18}" stroke="#eceee9"/><text x="${xx}" y="${H - 5}" text-anchor="middle" fill="#7a837c" font-size="8.5">${NF0.format(Math.round(v))}</text>`; }
  items.forEach((it, i) => {
    const y = i * rowH + pad;
    const lab = it.label.length > labW / 5.6 ? it.label.slice(0, Math.floor(labW / 5.6) - 1) + "…" : it.label;
    svg += `<text x="${labW - 8}" y="${y + rowH / 2 + 1}" text-anchor="end" fill="#1b211c" dominant-baseline="middle"><title>${esc(it.label)}</title>${esc(lab)}</text>`;
    const bh = series.length > 1 ? (rowH - 10) / 2 - 1 : rowH - 8;
    it.values.forEach((v, s) => {
      const yy = y + 1 + s * (bh + 2);
      const xa = Math.min(x(v), x0), w = Math.max(1, Math.abs(x(v) - x0));
      svg += `<rect x="${xa}" y="${yy}" width="${w}" height="${bh}" rx="2" fill="${colors[series[s].color] || series[s].color}"><title>${esc(it.label)}${series[s].name ? " – " + esc(series[s].name) : ""}: ${NF0.format(Math.round(v))}</title></rect>`;
      const roomLeft = xa - labW > 34;
      const lx = v >= 0 ? x(v) + 4 : (roomLeft ? xa - 4 : x0 + 4), anchor = v >= 0 || !roomLeft ? "start" : "end";
      if (s === series.length - 1 || opt.labelAll) svg += `<text x="${lx}" y="${yy + bh / 2 + 1}" text-anchor="${anchor}" dominant-baseline="middle" fill="#4d564f" font-size="9">${NF0.format(Math.round(v))}</text>`;
    });
  });
  svg += `<line x1="${x0}" x2="${x0}" y1="2" y2="${H - 18}" stroke="#7a837c" stroke-width="1"/></svg>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${colors[s.color] || s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return legend + svg;
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

        <tr><td>Renteinntekter</td><td class="n">${kr(V("total.renteinn"))}</td></tr>
        <tr><td>Renteutgifter</td><td class="n">${kr(-V("total.renteut"))}</td></tr>
        <tr class="s"><td>Nettoinntekt næring</td><td class="n">${kr(V("total.netto"))}</td></tr>
      </tbody></table>
      <h4>Frå skattemessig til driftsmessig resultat</h4>
      <table class="r"><tbody>
        <tr><td>Driftsoverskot jordbruk, skattemessig</td><td class="n">${kr(doS)}</td></tr>
        <tr><td>+ skattemessige avskrivingar</td><td class="n">${kr(V("total.avskr_skatt"))}</td></tr>
        <tr><td>− driftsmessige avskrivingar</td><td class="n">${kr(-V("total.avskr_drift"))}</td></tr>
        <tr><td>+ korrigering beholdningsendring (drift − skatt)</td><td class="n">${kr(V("total.korr_beh"))}</td></tr>
        <tr class="s"><td>Driftsoverskot jordbruk, driftsmessig</td><td class="n">${kr(doS + V("total.korr_avskr") + V("total.korr_beh"))}</td></tr>
        ${Math.abs(V("total.avvik")) >= 1 ? `<tr><td class="muted">Avvik mot analysen (ikkje fordelte postar)</td><td class="n muted">${kr(V("total.avvik"))}</td></tr>` : ""}
      </tbody></table>
    </div><div>
      <h4>Faste kostnader (kr)</h4>
      ${hbar(fItems, {width: 330, labelWidth: 130})}
      ${rowsTable("faste", "1.", /^2\./, {skipZero: true})}
      ${rowsTable("faste", "4.", /^5\./, {skipZero: true})}
      ${rowsTable("faste", "6.", /^7\./, {skipZero: true})}
      <h4>Nøkkeltal</h4>
      <table class="r"><tbody>
        <tr><td>DB m/tilskot i % av inntekter og tilskot</td><td class="n">${fmt(V("total.k_db_grad"), "pct")}</td></tr>
        <tr><td>Tilskot i % av DB m/tilskot</td><td class="n">${fmt(V("total.k_tilskot_del"), "pct")}</td></tr>
        <tr><td>Faste kostnader i % av DB m/tilskot</td><td class="n">${fmt(V("total.k_faste_del"), "pct")}</td></tr>
        <tr><td>Renteutgifter i % av driftsoverskot</td><td class="n">${fmt(V("total.k_rente_del"), "pct")}</td></tr>
        <tr><td>Maskinkostnader i % av faste kostnader</td><td class="n">${fmt(V("faste.k_maskin_del"), "pct")}</td></tr>
      </tbody></table>
    </div></div>${body}</div>`);
  // --- side 3: grovfôr
  if (hasGF) pages.push(body => `<div class="page"><div class="ph"><div class="t">Grovfôr og areal</div><div class="m">${esc(S.klient)}<br>Rekneskapsår ${esc(S.aar)}</div></div>
    <p>Grovfôrarealet blir korrigert slik at overflatedyrka jord tel 1/1,25 og kulturbeite 1/2,5 av fulldyrka. «Kueiningar» vektar dyretalet slik at ulike husdyrslag kan samanliknast.</p>
    <div class="ptiles">
      <div class="ptile"><div class="k">Korrigert grovfôrareal</div><div class="v">${fmt(V("grovfor.da_vk"), "n1")}</div><div class="s">dekar</div></div>
      <div class="ptile"><div class="k">Sum «kueiningar»</div><div class="v">${fmt(V("grovfor.sum_ku"), "n1")}</div><div class="s">${fmt(V("grovfor.korr_da_pr_ku"), "n2")} da pr kueining</div></div>
      <div class="ptile"><div class="k">Variabel grovfôrkostnad</div><div class="v">${kr(V("grovfor.varkost_pr_da"))}</div><div class="s">kr pr korrigert dekar</div></div>
      <div class="ptile"><div class="k">Maskinkostnad grovfôr</div><div class="v">${kr(V("grovfor.maskin_pr_da"))}</div><div class="s">kr pr dekar</div></div>
    </div>
    <div class="cols"><div><h4>Areal og utmark</h4>${rowsTable("grovfor", "1.", /^4\./, {skipZero: false})}</div>
    <div><h4>Kueiningar og grovfôrkostnad</h4>${rowsTable("grovfor", "4.", /^5\./, {skipZero: true})}<h4>Nøkkeltal</h4>${rowsTable("grovfor", "5.", /^$/)}</div></div>${body}</div>`);
  // --- produksjonssider
  prods.forEach(p => {
    const k = p.key, n = V(k + ".n");
    const kp = kpiList(p).filter(r => r.fmt !== "txt");
    const tiles = kp.slice(0, 4);
    const ur = unitRows(p);
    const costItems = ur.filter(r => /Variable kostnader/.test(r.sec) && !/^Sum/.test(r.label)).map(r => ({label: r.label, values: [V(k + "." + r.id)]})).filter(x => Math.abs(x.values[0]) > 0.005);
    pages.push(body => `<div class="page"><div class="ph"><div class="t">${esc(p.title)}</div><div class="m">${esc(S.klient)} · driftsgrein ${esc(p.dg)}<br>${fmt(n, "n")} ${esc(p.unit_label)} · rekneskapsår ${esc(S.aar)}</div></div>
      <div class="ptiles">${tiles.map(r => `<div class="ptile"><div class="k">${esc(r.label)}</div><div class="v">${fmt(V(k + "." + r.id), r.fmt)}</div><div class="s">${esc(r.unit === "kr/eining" ? "kr" : r.unit)}</div></div>`).join("")}</div>
      <div class="cols"><div>
        <h4>Resultat ${esc(p.per_label)} (kr)</h4>
        <table class="r"><tbody>${ur.map(r => { const v = V(k + "." + r.id); if (Math.abs(v) < 0.005 && !/i alt|^Sum|^DB/.test(r.label)) return "";
          const head = r.sec !== (r._prev); return `<tr class="${/i alt|^Sum|^DB /.test(r.label) ? "s" : ""}"><td>${esc(r.label)}</td><td class="n">${fmt(v, r.fmt)}</td></tr>`; }).join("")}</tbody></table>
        <h4>Variable kostnader ${esc(p.per_label)} (kr)</h4>
        ${costItems.length ? hbar(costItems, {width: 330, labelWidth: 150, compact: true}) : '<p class="muted">Ingen variable kostnader.</p>'}
      </div><div>
        <h4>Nøkkeltal</h4>
        <table class="r"><tbody>${kpiList(p).map(r => `<tr><td>${esc(r.label)}</td><td class="n">${fmt(V(k + "." + r.id), r.fmt)}</td></tr>`).join("")}</tbody></table>
        <h4>Totalt for produksjonen (kr)</h4>
        <table class="r"><tbody>
          <tr><td>Produksjonsinntekter i alt</td><td class="n">${kr(V(k + ".inn_total"))}</td></tr>
          <tr><td>Variable kostnader i alt</td><td class="n">${kr(V(k + ".kost_total"))}</td></tr>
          <tr class="s"><td>DB utan tilskot</td><td class="n">${kr(V(k + ".db_u"))}</td></tr>
          <tr><td>Tilskot</td><td class="n">${kr(V(k + ".tilskot"))}</td></tr>
          <tr class="s"><td>DB med tilskot</td><td class="n">${kr(V(k + ".db_m"))}</td></tr>
          <tr><td>Maskinkostnader</td><td class="n">${kr(V(k + ".maskin"))}</td></tr>
          ${p.group !== "plante" ? `<tr><td>Innandørsmekanisering</td><td class="n">${kr(V(k + ".innmek"))}</td></tr>` : ""}
          <tr class="s"><td>Att etter maskin${p.group !== "plante" ? " og innandørsmek." : ""}</td><td class="n">${kr(V(k + ".db_etter"))}</td></tr>
        </tbody></table>
      </div></div>
      <h4>Kommentar</h4><div class="box">${prodComment(p)}</div>${body}</div>`);
  });
  // --- korrigeringar
  const L = lagerRows().filter(l => Math.abs(l.korr) > 0.5), AV = avskrRows().filter(x => Math.abs(x.diff) > 0.5);
  const ov = Object.entries(S.overrides).filter(([, v]) => v != null && v !== "");
  const man = Object.entries(S.assign).filter(([, v]) => v && v.t1);
  pages.push(body => `<div class="page"><div class="ph"><div class="t">Korrigeringar og føresetnader</div><div class="m">${esc(S.klient)}<br>Rekneskapsår ${esc(S.aar)}</div></div>
    <p>Analysen byggjer på saldobalansen frå ${esc(S.source)}. Tala er korrigerte til driftsmessige verdiar slik det går fram under.</p>
    <h4>Driftsmessige verdiar på varelager og buskap</h4>
    ${L.length ? `<table class="r"><thead><tr><th>Konto</th><th class="n">Skatt 1.1.</th><th class="n">Skatt 31.12.</th><th class="n">Drift 1.1.</th><th class="n">Drift 31.12.</th><th class="n">Korrigering</th></tr></thead><tbody>
      ${L.map(l => `<tr><td>${esc(l.r.nr)} ${esc(l.r.navn)}</td><td class="n">${kr(l.r.ib)}</td><td class="n">${kr(l.r.ub)}</td><td class="n">${kr(l.ibD)}</td><td class="n">${kr(l.ubD)}</td><td class="n">${kr(l.korr)}</td></tr>`).join("")}
      <tr class="s"><td>Sum</td><td></td><td></td><td></td><td></td><td class="n">${kr(L.reduce((s, l) => s + l.korr, 0))}</td></tr></tbody></table>` : '<p class="muted">Ingen.</p>'}
    <h4>Driftsmessige avskrivingar</h4>
    ${AV.length ? `<table class="r"><thead><tr><th>Konto</th><th class="n">Skattemessig</th><th class="n">Driftsmessig</th><th class="n">Grunnlag</th></tr></thead><tbody>
      ${AV.map(x => `<tr><td>${esc(x.r.nr)} ${esc(x.r.navn)}</td><td class="n">${kr(x.skatt)}</td><td class="n">${kr(x.drift)}</td><td class="n">${x.verdi && x.levetid && !x.manual ? kr(x.verdi) + " / " + x.levetid + " år" : "manuelt"}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">Ingen.</p>'}
    <h4>Flytta beløp</h4>
    ${S.moves.filter(mv => mv.fra && mv.til && num(mv.belop)).length ? `<table class="r"><thead><tr><th>Frå</th><th>Til</th><th class="n">Beløp</th><th>Forklaring</th></tr></thead><tbody>
      ${S.moves.filter(mv => mv.fra && mv.til && num(mv.belop)).map(mv => `<tr><td>${esc(mv.fra)} ${esc(kontoNavn(mv.fra))}</td><td>${esc(mv.til)} ${esc(kontoNavn(mv.til))}</td><td class="n">${kr(num(mv.belop))}</td><td>${esc(mv.tekst)}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">Ingen.</p>'}
    <h4>Manuelle koplingar og overstyrte tal</h4>
    ${man.length || ov.length ? `<table class="r"><tbody>
      ${man.map(([nr, a]) => `<tr><td>${esc(nr)} ${esc(kontoNavn(nr))}</td><td>${esc(PNAME[a.t1] || SPECIAL[a.t1])}${a.t2 ? ` ${100 - num(a.p2)} % / ${esc(PNAME[a.t2] || SPECIAL[a.t2])} ${num(a.p2)} %` : ""}</td></tr>`).join("")}
      ${ov.map(([f, v]) => `<tr><td>${esc(SHEET[f.split(".")[0]].sheet)}: ${esc(ROW[f] ? ROW[f].label : f)}</td><td>overstyrt til ${fmt(num(v), ROW[f] ? ROW[f].fmt : "n")}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">Ingen.</p>'}
    <h4>Fordelingsnøklar</h4>
    <table class="r"><thead><tr><th>Produksjon</th><th class="n">Fellespott</th><th class="n">Maskinkostnader</th><th class="n">Innandørsmek.</th></tr></thead><tbody>
      ${prods.map(p => `<tr><td>${esc(p.sheet)}</td><td class="n">${fmt((M.poolKey[p.key] || 0) / 100, "pct")}</td><td class="n">${fmt((M.maskinKey[p.key] || 0) / 100, "pct")}</td><td class="n">${fmt((M.innmekKey[p.key] || 0) / 100, "pct")}</td></tr>`).join("")}</tbody></table>
    <p class="muted" style="margin-top:8px">Metode: same oppsett som Duett-basert nøkkeltalsanalyse. Formlane for kvar produksjon er dokumenterte i Excel-arbeidsboka «Analyse_jordbruk_produksjonar.xlsx».</p>${body}</div>`);
  const tot = pages.length;
  return pages.map((fn, i) => fn(`<div class="pf"><span>Nøkkeltalsanalyse jordbruk · ${esc(S.klient)} · ${esc(S.aar)}</span><span>Side ${i + 1} av ${tot}</span></div>`)).join("");
}
function renderRapport(m) {
  const M = MODEL;
  m.innerHTML = `
  <section class="card no-print">
    <h2>5. Rapport</h2>
    <p class="lead">Førehandsvisning av analyserapporten. Last ned som PDF eller skriv ut. Går du tilbake og endrar tal, blir rapporten oppdatert.</p>
    <div class="row"><button class="btn primary" id="btnPdf">Last ned PDF</button><button class="btn" id="btnPrint">Skriv ut</button>
    <span class="muted small" id="pdfStatus"></span></div>
    ${!M.active.size ? `<div class="notice warn">Ingen aktive produksjonar – rapporten viser berre totaløkonomi.</div>` : ""}
  </section>
  <section class="card" style="padding:0;border:0;box-shadow:none;background:none"><div class="preview-shell" id="preview">${buildReport()}</div></section>`;
  $("#btnPdf").onclick = downloadPdf;
  $("#btnPrint").onclick = () => window.print();
}
function downloadPdf() {
  const shell = $("#preview");
  if (!shell) return;
  if (typeof html2pdf === "undefined") { alert("PDF-biblioteket er ikkje lasta (krev internett). Bruk «Skriv ut» og vel «Lagre som PDF»."); return; }
  const st = $("#pdfStatus"); if (st) st.textContent = "Lagar PDF …";
  const pages = [...shell.querySelectorAll(".page")];
  const oldMax = shell.style.maxHeight; shell.style.maxHeight = "none";
  const file = `Nokkeltalsanalyse_${(S.klient || "klient").replace(/[^\wæøåÆØÅ]+/g, "_")}_${S.aar}.pdf`;
  const opt = {margin: 0, filename: file, image: {type: "jpeg", quality: 0.95},
    html2canvas: {scale: 2, useCORS: true, backgroundColor: "#ffffff", scrollX: 0, scrollY: 0},
    jsPDF: {unit: "mm", format: "a4", orientation: "portrait", compress: true}};
  let w = html2pdf().set(opt).from(pages[0]).toPdf();
  pages.slice(1).forEach(pg => { w = w.get("pdf").then(pdf => pdf.addPage()).from(pg).toContainer().toCanvas().toPdf(); });
  const done = msg => { shell.style.maxHeight = oldMax; if (st) st.textContent = msg; };
  return w.save().then(() => done("PDF lasta ned (" + pages.length + " sider)."), () => done("Klarte ikkje å lage PDF – bruk «Skriv ut»."));
}

render();
</script>
</body>
